services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
  api:
    build: .
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/omeganexora
      JWT_SECRET: local-dev-change-this-secret-1234567890
      REFRESH_TOKEN_SECRET: local-dev-refresh-secret-1234567890
      CORS_ORIGIN: http://localhost:3000
      SOCKET_CORS_ORIGIN: http://localhost:3000
      LOCATION_UPDATE_MIN_INTERVAL_MS: 3000
      LOCATION_MAX_ACCURACY_METERS: 100
      MATCH_RADIUS_KM: 10
      MATCH_MAX_RESULTS: 10
      ETA_SPEED_KMPH: 24
    ports:
      - "5000:5000"
volumes:
  mongo_data:
